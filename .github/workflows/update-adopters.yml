name: update adopters

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Open adopter update PRs
        env:
          GH_TOKEN: ${{ secrets.ADOPTER_UPDATE_TOKEN }}
        run: python3 tools/update_adopters.py
