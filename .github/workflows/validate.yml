name: validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Engineering Records Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install distributable validator
        run: python3 -m pip install --disable-pip-version-check .
      - name: Validate adopted repository contract
        run: ter validate .
      - name: Self-test canonical validator
        run: python3 validate.py --self-test
      - name: Validate suite
        run: python3 validate.py
      - name: Validate decision matrix weights
        run: python3 validate_matrix.py
      - name: Fixture tests
        run: python3 tests/test_fixtures.py
