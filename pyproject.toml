[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecfu-engineering-records"
version = "1.6.0"
description = "Executable validator and standard installer for the TecFu Engineering Records suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TecFu" }]
dependencies = []

[project.scripts]
ter = "ter.cli:main"

[project.urls]
Homepage = "https://github.com/tecfu/tecfu-engineering-records"
Repository = "https://github.com/tecfu/tecfu-engineering-records"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ter = ["suite.json", "standards/**/*.md"]
